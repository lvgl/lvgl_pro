name: Pull Request Check

on:
    pull_request:
        types: [opened, edited, synchronize, reopened]
    push:
        branches:
            - master

jobs:
    common-template-files:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout current repository
              uses: actions/checkout@v4

            - name: Check the common template files
              run: .github/scripts/check-common-template-files.sh

    # A job-level `if` cannot read `secrets`, which is why this is a separate job:
    # it publishes "is the token there" as an output that pr-check can be gated on.
    # Checking inside pr-check cannot work, because a step that exits 0 ends only
    # itself and the CLI steps after it still run.
    token:
        runs-on: ubuntu-latest
        outputs:
            available: ${{ steps.probe.outputs.available }}

        steps:
            - name: Look for the CLI token
              id: probe
              env:
                  LVGLPRO_CLI_TOKEN: ${{ secrets.LVGLPRO_CLI_TOKEN }}
              run: |
                  if [ -n "$LVGLPRO_CLI_TOKEN" ]; then
                    echo 'available=true' >>"$GITHUB_OUTPUT"
                  else
                    echo 'available=false' >>"$GITHUB_OUTPUT"
                    echo 'LVGLPRO_CLI_TOKEN is not set, so pr-check will be skipped.'
                  fi

    pr-check:
        needs: token
        if: needs.token.outputs.available == 'true'
        runs-on: ubuntu-latest
        env:
            LVGLPRO_CLI_TOKEN: ${{ secrets.LVGLPRO_CLI_TOKEN }}

        steps:
            - name: Checkout current repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22.13.0'

            - name: Setup emsdk
              uses: mymindstorm/setup-emsdk@v14
              with:
                  version: 4.0.6

            - name: Remove Generated Files
              run: find examples/lvgl_open -path examples/lvgl_open/images -prune -o -type f \( -name '*.c' -o -name '*.h' \) -print | xargs rm -f

            - name: Install CLI
              run: npm install --global @lvgl/lvglpro

            - name: Generate Code
              run: |
                  lvglpro generate examples/lvgl_open

            - name: Compile Code
              run: |
                  lvglpro compile examples/lvgl_open --target cli

            - name: Run tests
              run: |
                  lvglpro run-all-tests examples/lvgl_open
